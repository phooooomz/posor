
name: Nanosaur WebAssembly Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "extern/**"
      - "CMakeLists.txt"
      - ".github/workflows/nanosaur-web.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Show tool versions
        run: |
          emcc --version
          cmake --version
          git submodule status

      - name: Configure Web build
        run: |
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_FLAGS="-sUSE_SDL=2" \
            -DCMAKE_CXX_FLAGS="-sUSE_SDL=2" \
            -DCMAKE_EXE_LINKER_FLAGS="-sUSE_SDL=2 -sFULL_ES2=1 -sALLOW_MEMORY_GROWTH=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2"

      - name: Build Nanosaur
        run: |
          cmake --build build-web --target Nanosaur -- -v

      - name: Collect build files
        if: always()
        run: |
          mkdir -p web-artifacts
          cp -r build-web/* web-artifacts/ 2>/dev/null || true
          cp CMakeCache.txt web-artifacts/ 2>/dev/null || true
          find web-artifacts -maxdepth 4 -type f | head -200

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanosaur-web-build
          path: web-artifacts/
          if-no-files-found: warn
          
