name: Nanosaur WebAssembly Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Pomme exists
        run: |
          if [ ! -f extern/Pomme/CMakeLists.txt ]; then
            rm -rf extern/Pomme
            git clone --depth 1 https://github.com/jorio/Pomme.git extern/Pomme
          fi
          test -f extern/Pomme/CMakeLists.txt
          echo "Pomme is ready"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Verify tools
        run: |
          emcc --version
          cmake --version
          git submodule status

      - name: Configure Web build
        run: |
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build Nanosaur
        run: |
          cmake --build build-web --target Nanosaur

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p web-artifacts
          cp build-web/Nanosaur.html build-web/Nanosaur.js build-web/Nanosaur.wasm build-web/Nanosaur.data web-artifacts/ 2>/dev/null || true
          find web-artifacts -maxdepth 2 -type f

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanosaur-web-build
          path: web-artifacts/
          if-no-files-found: warn
